    <!--
      다크 모드로 저장한 사용자가 새로고침할 때 흰 화면이 번쩍이지 않도록,
      React 가 마운트되기 전에 테마 클래스를 먼저 붙인다.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('brandpage:theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.add(dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>

      gtag('config', 'G-3Y3CT8PC1X');
